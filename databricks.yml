# Databricks Asset Bundle (DAB) root for Maven Market.
# Path gotcha: paths in THIS file are relative to ./ (e.g. ./src/...),
# paths inside resources/*.yml are relative to that file (e.g. ../src/...).
bundle:
  name: maven_market

include:
  - resources/*.yml

# Build the maven_market wheel so jobs/pipelines can reference ../dist/*.whl
artifacts:
  default:
    type: whl
    build: python -m build --wheel
    path: .

variables:
  catalog:
    description: Unity Catalog catalog that holds all Maven Market schemas
    default: maven_market_uc
  bronze_schema:
    default: bronze
  silver_schema:
    default: silver
  gold_schema:
    default: gold
  audit_schema:
    default: audit
  secret_scope:
    description: Databricks secret scope (backed by Azure Key Vault)
    default: maven_market
  env:
    description: Config environment name passed to maven_market.config.load_config()
    default: dev

targets:
  dev:
    mode: development
    default: true
    variables:
      env: dev
    workspace:
      # Replace with your dev workspace URL (or set DATABRICKS_HOST and remove this line).
      host: https://REPLACE-dev-workspace.azuredatabricks.net

  prod:
    mode: production
    variables:
      env: prod
    workspace:
      # Replace with your prod workspace URL.
      host: https://REPLACE-prod-workspace.azuredatabricks.net
      # production mode requires an explicit root_path outside any user's home
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    # run_as: {service_principal_name: <deploy-sp-application-id>}  # set in Phase 8 (T8.3)
