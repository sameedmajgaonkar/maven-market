[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maven_market"
version = "0.1.0"
description = "Maven Market - Secure Retail Analytics Lakehouse (Databricks capstone)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
bronze_csv = "maven_market.jobs.bronze_csv:main"

[project.optional-dependencies]
# Installed in CI and local dev; on Databricks these are provided by the runtime.
dev = [
    "pytest>=8.0",
    "flake8>=7.0",
    "build>=1.2",
    "pyspark>=3.5",
    "confluent-kafka>=2.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]
